name: scheduled-secret-scan

# GAP-SEC-1 (SEC-19): gitleaks runs in ci.yml, but gitleaks-action scans the
# commit range of the trigger that started it -- on a pull request, `HEAD^..HEAD`.
# It has never read this repository's history. A credential committed before
# either scanner existed, or on a branch that was merged as a squash, is invisible
# to it and always will be.
#
# This job re-reads the entire history with a second engine, on a schedule, so a
# leak is found even when no code changes.
on:
  schedule:
    - cron: "27 5 * * 3" # Wednesdays 05:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One scan at a time; there is no ref to key on that would mean anything for a
  # schedule-only workflow, and two concurrent full-history scans would only
  # contend for the runner.
  group: scheduled-secret-scan
  cancel-in-progress: false

jobs:
  trufflehog:
    name: full-history secret scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Egress monitoring (SEC-04), AUDIT mode -- see the note in scorecard.yml
      # for why a new job in this repository starts in audit and not in block.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # The whole point of this job. `actions/checkout` is one commit deep by
          # default, and a full-history scan of one commit is a scan that reports
          # clean on a history it never opened -- a gate that cannot fail.
          fetch-depth: 0
          persist-credentials: false
      - name: Full-history secret scan (trufflehog)
        # The pinned binary, verified against the release checksum file, rather
        # than a third-party Action -- same reasoning as ci.yml running the
        # gitleaks binary directly.
        #
        # `git file://.` with no --since-commit and no --branch walks every commit
        # reachable from every ref in the checkout.
        #
        # `--results=verified,unknown,unverified` is load-bearing, and every
        # narrower setting was measured before this one was chosen.
        #
        # TruffleHog sorts a finding into three tiers: `verified` (it
        # authenticated against the live service), `unverified` (it asked, and
        # the service said no) and `unknown` (it could not ask). A credential
        # that was committed and then revoked -- the normal end state of a real
        # leak, and the exact case a history scan exists to find -- comes back
        # `unverified`, because the revocation is what makes the check fail.
        #
        # So `--only-verified` cannot fail on a cleaned-up leak, which is
        # recorded in the gap ledger. What is not obvious, and what a negative
        # control found, is that `--results=verified,unknown` cannot either: it
        # excludes the same tier by a different name. Measured 2026-09-06 on a
        # throwaway clone of this repository with an AWS key planted in one
        # commit and deleted in the next:
        #
        #   --results=verified,unknown             exit 0, 0 secrets reported
        #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
        #
        # The usual argument for dropping `unverified` is committed placeholder
        # fixtures. That was checked rather than assumed: this repository's full
        # history scans clean under all three tiers (2,410 chunks, 0 findings),
        # so the exclusion buys nothing here and costs the whole point of the job.
        # If a placeholder ever does fire, exclude that detector by name; do not
        # widen the hole back to a whole tier.
        run: |
          set -euo pipefail
          TH=3.95.8
          BASE="https://github.com/trufflesecurity/trufflehog/releases/download/v${TH}"
          ARCHIVE="trufflehog_${TH}_linux_amd64.tar.gz"
          curl -sSfL -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL -o /tmp/trufflehog_checksums.txt \
            "${BASE}/trufflehog_${TH}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" trufflehog_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp trufflehog
          /tmp/trufflehog git file://. \
            --results=verified,unknown,unverified \
            --fail \
            --no-update
