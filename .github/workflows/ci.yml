name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, single-version gate: lint, types, security, accessibility, container, and
  # (since 2026-08-26) the integrity of the merge gate itself — see steps 9a/9b.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Step 9b reads the nightly workflow's runs and their jobs. `administration` is
      # deliberately absent and cannot be requested here at all, which is why step 9a
      # runs `--scope public` and says out loud what that leaves unchecked.
      actions: read     # step 9b lists nightly.yml's runs and their jobs; read-only
    steps:
      # 0. egress monitoring (SEC-04). AUDIT mode: logs, does not block yet — this
      #    repo's actual outbound needs (pypi.org, files.pythonhosted.org, npm for
      #    pa11y, Docker Hub for the base image, github.com) haven't been collected
      #    from a real run yet. Flip to `egress-policy: block` with an explicit
      #    allowlist once one audit-mode run's log has been reviewed — see
      #    docs/GAP-LEDGER.md#gap-sec-1--security--supply-chain-harden-runner-block-mode-codeql-lockfileosv-scanner-trufflehog-sbomsigning-scorecard.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          # gitleaks-action scans commit ranges (HEAD^..HEAD on PRs), which a shallow
          # clone cannot resolve — full history is required for the blocking scan.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked --group dev --python 3.12

      # 1. format + lint — via the Makefile so CI runs literally the same command
      #    as `make lint` (CICD-27: no more local/CI drift on this gate).
      - name: Lint & format
        run: make lint

      # 1b. the committed pre-commit hook set — via `make hooks`, for the same parity
      #     reason as step 1, and because the one hook that is skipped is named there
      #     rather than in two places. `.pre-commit-config.yaml` has been in the tree
      #     since 2026-07-14 and was enforced nowhere: it ran only for a developer who
      #     had run `pre-commit install`, so its end-of-file, trailing-whitespace,
      #     YAML-syntax, line-ending and large-file hooks gated nothing that merged
      #     (GAP-CQ-1 / CQ-12). This runs them against every tracked file.
      #
      #     Not covered by this step, deliberately, and said out loud rather than left
      #     to look covered: the gitleaks hook (its entry is `gitleaks protect
      #     --staged`, and a CI checkout stages nothing, so it would pass without
      #     reading a byte — see the Makefile, which is where the SKIP lives) and the
      #     pre-push-staged mypy hook (bare `mypy` on this repo's config, which is
      #     step 2 below). The real secret scan is gitleaks-action in step 4.
      - name: Pre-commit hooks
        run: make hooks

      # 1c. static analysis of the workflows themselves (GAP-CICD-1 / CICD-19) — via
      #     `make workflows`, same parity rationale, and because the zizmor version is
      #     pinned in one place there rather than two. It runs inside this already-
      #     required job rather than as a new required context: five required checks
      #     that could not fail were removed from this repository on 2026-08-26, and
      #     the lesson recorded then was that adding a context name is how such a check
      #     gets in.
      #
      #     Not covered by this step, deliberately: zizmor's default persona hides
      #     informational findings and prints "(N suppressed)". The target echoes what
      #     `--persona=auditor` reports so the hidden count is visible in the log; that
      #     line is a disclosure, not a gate, and the three findings it currently
      #     reports are recorded in docs/GAP-LEDGER.md#gap-cicd-1 with the reason each
      #     is not acted on. CodeQL over the same surface runs in codeql.yml, which
      #     reports to code scanning and does not block a merge.
      - name: Workflow static analysis (zizmor)
        run: make workflows

      # 2. type-check (strict) — via `make type` (same parity rationale).
      - name: Type-check
        run: make type

      # 2b. i18n N/A-declaration gate — `make verify` runs this locally; CI was
      #     silently skipping it until now (CICD-27 / I18N-02 CI-wiring gap).
      - name: i18n declaration gate
        run: make i18n

      # 3b. EXP-06 tagged PDF/A export: the optional `pdf` extra needs a >=3.10 host
      #     (this job already runs 3.12) plus WeasyPrint's native text/image-rendering
      #     libraries (Pango, HarfBuzz, GDK-Pixbuf — not a PyPI package, see
      #     docs/adr/0004-weasyprint-for-tagged-pdf-a-export.md). Structural-only gate
      #     (tests/test_pdf_export.py); does not and cannot verify PDF/UA conformance
      #     — see that ADR and docs/GAP-LEDGER.md#gap-a11y-2 for the human gate that
      #     stays open regardless of this test passing.
      - name: Install WeasyPrint's native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libgdk-pixbuf2.0-0
      - name: Install pdf extra
        run: uv sync --locked --group dev --extra pdf --python 3.12
      - name: Tagged PDF/A structural tests
        run: .venv/bin/pytest tests/test_pdf_export.py -q

      # 4. security: SAST + deps + secrets. Kept as discrete steps (rather than
      #    `make security`) because that target's gitleaks check expects a CLI
      #    binary on PATH, whereas gitleaks-action below runs it as a container
      #    action; see CONTRIBUTING.md's "Local/CI parity" section, which is the
      #    authoritative statement of every place this workflow and `make verify`
      #    differ. (This comment used to cite docs/RESPONSIBLE-TECH-AUDITS.md §F
      #    and the README's Standards Conformance table for "the exact local/CI
      #    parity statement"; the word parity appears in neither.)
      - name: SAST (bandit)
        run: .venv/bin/bandit -q -r monitor store report
      #    The dependency audit is deliberately NOT `make security`'s command. That target
      #    passes `PIP_AUDIT_WAIVERS`; this passes nothing, so CI is the stricter of the
      #    two. The waivers exist because the local dev venv targets the documented >=3.9
      #    floor (CQ-01) and no fix version for those advisories installs under 3.9, while
      #    this job runs 3.12 where uv.lock resolves the fixed versions -- fixed, not
      #    waived. Keeping the waivers out of here is what stops a 3.9-only accommodation
      #    from silently becoming CI's policy. The consequence -- a green `make verify`
      #    does not by itself predict a green run here -- is stated in CONTRIBUTING.md's
      #    Local/CI parity table, and `tests/test_doc_figures.py` fails if the two
      #    commands diverge without that table saying so. `make security
      #    PIP_AUDIT_WAIVERS=` reproduces this step locally.
      - name: Dependency audit
        run: .venv/bin/pip-audit
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      # 5. accessibility: structural gate is in pytest; add axe + htmlcs via pa11y on
      #    the report. axe's color-contrast rule is excluded here because axe cannot
      #    resolve the background of SVG <text> and returns every chart label as
      #    "needs further review", which pa11y hard-fails (51 false positives on this
      #    report). SVG text contrast is NOT unchecked: tests/test_svg_contrast.py
      #    computes the exact WCAG ratios for every renderer color pair and is
      #    merge-blocking; htmlcs below keeps computed HTML color-contrast blocking.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - name: Render report & run pa11y (htmlcs + axe)
        run: |
          .venv/bin/python scripts/demo_report.py
          printf '%s\n' '{"chromeLaunchConfig":{"args":["--no-sandbox"]}}' > /tmp/pa11y-ci.json
          npx --yes pa11y --runner htmlcs --runner axe --ignore color-contrast \
            --config /tmp/pa11y-ci.json ./report.html

      # 5b. accessibility (PWA UI): axe pass against the browser edition's page.
      #     Unlike the report step above, plain axe (color-contrast included) is right
      #     here: this is real HTML, so axe can compute every background. Chrome needs
      #     --no-sandbox on hosted runners.
      - name: Run pa11y (axe) on the PWA UI
        run: |
          printf '%s\n' '{"chromeLaunchConfig":{"args":["--no-sandbox"]}}' > /tmp/pa11y-pwa.json
          npx --yes pa11y --runner axe --config /tmp/pa11y-pwa.json ./pwa/index.html

      # 6b. PWA variant: detector/report ports tested with Node's test runner
      - name: PWA tests
        run: make pwa-test

      # 8. portability: the container builds and its bring-up runs from scratch
      - name: Build container & smoke test
        run: |
          docker build -t olive .
          docker run --rm olive --help

      # 8b. container CVE scan (SEC-28, Tier-1 red until now; feeds REL-18).
      - name: Container CVE scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "olive"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      # 7. responsible-tech checks are the no-audio / no-egress / report-content tests,
      #    run in the matrix test job below (merge-blocking).

      # 9. The merge gate checks itself. Both of these live inside `verify` on purpose:
      #    `verify` is already a required context, so they gain teeth without adding a
      #    required check name, and adding a name is how the defect they exist to
      #    prevent got in. Both are seconds on the default runner (§11b).
      #
      # 9a. The live branch ruleset still matches the reviewed file. Nothing enforced
      #     this before: `make ruleset-check` existed, was correct, could fail, and ran
      #     nowhere. A PR that quietly rewrote .github/rulesets/main.json merged green.
      #     `--scope public` because the Actions GITHUB_TOKEN cannot be granted the
      #     `administration` permission, so it cannot see bypass actors; the step prints
      #     that limit itself rather than implying full coverage.
      - name: Branch ruleset matches the committed definition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python scripts/check_ruleset.py --scope public

      # 9b. The nightly macOS sweep really ran, on real macOS runners, and passed. This
      #     replaces the five `test-matrix (macos-latest, X)` contexts that the ruleset
      #     used to require and that `test-matrix-macos-nightly-notice` satisfied with an
      #     `echo` on an ubuntu runner (labels: ["ubuntu-latest"], 4 seconds, always
      #     green). It is a strictly weaker claim than those five implied, and a real
      #     one: it can go red, and the script says exactly what it does not cover.
      - name: Nightly macOS sweep ran, on macOS, and passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python scripts/check_nightly_macos.py

  # Compatibility matrix: tests + coverage across supported Python versions.
  # macOS legs (10x minutes, CI-CD-STANDARD §11b) run on the nightly schedule in
  # nightly.yml. Until 2026-08-26 a twin job here reported the five ruleset-required
  # `test-matrix (macos-latest, X)` contexts green from an `echo` on an ubuntu runner.
  # Those five contexts are no longer required (.github/rulesets/main.json) and the twin
  # is deleted; the nightly sweep is now held to account by `verify`'s step 9b instead.
  # Do not reintroduce a stand-in job: a required context whose job cannot fail is worse
  # than an absent one, because it reads as coverage.
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # 0. egress monitoring (SEC-04), audit mode — see the `verify` job's identical
      #    step above for why this isn't block mode yet.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The matrix value reaches the shell through the environment, not through
      # template expansion into the `run:` text. It is a workflow-controlled literal
      # today, so this is not a live injection -- but the shape is the one that becomes
      # one the moment the value comes from anywhere else, and it is what zizmor's
      # template-injection audit flags. Same fix in the other matrix job.
      - name: Install
        env:
          UV_PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --locked --group dev --python "$UV_PYTHON_VERSION"
      - name: Tests & coverage
        run: .venv/bin/pytest --cov --cov-report=term-missing --cov-fail-under=85
