# CodeQL over the workflows themselves (GAP-CICD-1, CICD-20).
#
# GAP-CICD-1 named two static-analysis gaps: no zizmor step and no CodeQL
# `language: actions` workflow. zizmor runs inside the already-required `verify` job
# (`make workflows`), because adding a new required context is how a placeholder gate
# got into this repository once already -- see the 2026-08-26 entry in
# docs/GAP-LEDGER.md. CodeQL cannot run that way: it needs its own workflow to upload
# SARIF to code scanning, so it is a new context by necessity.
#
# WHAT THIS DOES NOT DO, said out loud rather than left to look covered: this workflow
# does not block a merge. `codeql-action/analyze` fails only when the analysis itself
# errors; a finding is published as a code-scanning alert and the job still exits 0.
# Making CodeQL merge-blocking means either a code-scanning merge-protection rule or
# adding `codeql (actions)` to `.github/rulesets/main.json`, and both are owner
# decisions about the required-check list rather than something a workflow file can
# assert. GAP-CICD-1 records that as the open follow-up. Until then this is reporting,
# not gating, and `make workflows` is the enforced floor for the workflow surface.
#
# `language: actions` only. Python analysis is a separate question with a separate
# cost, and this repository's runtime core is stdlib-only, so the workflow surface is
# where an injected expression or an unpinned third-party action would actually reach
# a token. Adding python later is one matrix entry.
#
# Actions are pinned to the full 40-character commit SHA of their tag, matching every
# other workflow here; `db488dd` is `github/codeql-action` v4.37.8.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, offset from the 06:37 nightly macOS sweep so a red morning has one cause.
    - cron: "17 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read          # checkout only
      security-events: write  # upload the SARIF result to code scanning
    steps:
      # harden-runner in audit mode, matching ci.yml and for the same reason: this
      # repository's real outbound needs have not been collected from a run's log yet,
      # so block mode with a guessed allow-list would fail on a legitimate fetch.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: actions
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          category: "/language:actions"
